services:
  - type: web
    name: flare-backend
    runtime: python
    rootDir: backend          # Render runs all commands from backend/ — fixes "No module named 'routers'"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false           # Set this to your deployed frontend URL in Render dashboard
